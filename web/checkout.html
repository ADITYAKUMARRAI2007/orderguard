<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pay — OrderGuard</title>
<link rel="stylesheet" href="/app-assets/app.css">
<style>
  body { max-width: 480px; margin: 8vh auto; padding: 0 24px; }
  .box { background: var(--card, #fff); border-radius: 16px; padding: 32px;
         box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .row { display: flex; justify-content: space-between; padding: 10px 0;
         border-bottom: 1px solid rgba(0,0,0,.06); font-size: 14px; }
  .row strong { font-weight: 600; }
  #payBtn { width: 100%; margin-top: 20px; padding: 14px; border: 0;
            border-radius: 10px; background: #1a1a1a; color: #fff;
            font-size: 15px; cursor: pointer; }
  #payBtn:disabled { opacity: .5; cursor: default; }
  #status { margin-top: 16px; font-size: 14px; line-height: 1.5; white-space: pre-wrap; }
  #status.ok { color: #0a7a3d; } #status.err { color: #b3261e; }
  .gate-note { font-size: 12px; color: #666; margin-top: 4px; }
</style>
</head>
<body>
  <div class="box">
    <h2>Confirm and pay</h2>
    <div id="rows"></div>
    <button id="payBtn">Pay with Razorpay (test mode)</button>
    <div class="gate-note" id="gateNote"></div>
    <div id="status"></div>
  </div>

  <!-- Razorpay's own script. This page never sees a card number, UPI PIN, or
       OTP — those are entered on Razorpay's own Checkout overlay. -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script>
    const sessionId = location.pathname.split("/").pop();

    async function api(path, opts) {
      const res = await fetch(path, { headers: { "Content-Type": "application/json" }, ...opts });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(body.detail?.reasons?.join(" ") || body.detail || res.statusText);
      return body;
    }

    function money(paise) { return "₹" + (paise / 100).toFixed(2); }

    function showStatus(text, ok) {
      const el = document.getElementById("status");
      el.textContent = text;
      el.className = ok ? "ok" : "err";
    }

    async function verify(paymentId, signature) {
      showStatus("Verifying with Razorpay directly — not trusting this page's own success message…", true);
      const result = await api(`/api/sessions/${sessionId}/payment/verify`, {
        method: "POST",
        body: JSON.stringify({ razorpay_payment_id: paymentId, razorpay_signature: signature }),
      });
      if (result.captured) {
        showStatus(
          `Paid and verified. ${money(result.amount_paise)} captured.` +
          (result.already_captured ? "\n(This purchase was already recorded — nothing was charged twice.)" : ""),
          true
        );
      } else {
        showStatus(`Not accepted: ${result.reason}`, false);
      }
    }

    async function start() {
      const btn = document.getElementById("payBtn");
      btn.disabled = true;
      showStatus("Checking eleven safety gates before any money can move…", true);
      try {
        const order = await api(`/api/sessions/${sessionId}/payment/order`, { method: "POST" });
        document.getElementById("gateNote").textContent =
          `${order.gates_passed}/${order.gates_total} pre-payment checks passed.`;

        document.getElementById("rows").innerHTML =
          `<div class="row"><span>Amount</span><strong>${money(order.amount_paise)}</strong></div>
           <div class="row"><span>Order</span><strong>${order.razorpay_order_id}</strong></div>`;

        if (order.status === "captured") {
          showStatus(`Already paid and verified. ${money(order.amount_paise)} captured.`, true);
          btn.textContent = "Already paid"; return;
        }

        const rzp = new Razorpay({
          key: order.key_id,
          order_id: order.razorpay_order_id,
          amount: order.amount_paise,
          currency: order.currency,
          name: "OrderGuard (test mode)",
          description: "Guarded purchase — verified server-side before it counts",
          handler: (response) => {
            // The browser's own "success" is evidence of nothing — see
            // payment.py. The real check happens in verify(), against
            // Razorpay's own independently-fetched record.
            verify(response.razorpay_payment_id, response.razorpay_signature);
          },
          modal: { ondismiss: () => { btn.disabled = false; showStatus("Payment window closed. Nothing was charged.", true); } },
        });
        rzp.on("payment.failed", (r) => showStatus(`Payment failed: ${r.error.description}`, false));
        btn.disabled = false;
        btn.onclick = () => rzp.open();
      } catch (err) {
        showStatus(`Stopped before payment: ${err.message}`, false);
        btn.disabled = true;
      }
    }

    start();
  </script>
</body>
</html>
