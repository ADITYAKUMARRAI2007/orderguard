[project]
name = "orderguard"
version = "0.1.0"
description = "A commerce agent that verifies what it bought, and proves the store recorded it exactly once."
requires-python = ">=3.13"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orderguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
