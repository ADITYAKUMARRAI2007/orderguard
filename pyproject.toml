[project]
name = "orderguard"
version = "0.1.0"
description = "A commerce agent that verifies what it bought, and proves the store recorded it exactly once."
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.28",
  "pydantic>=2.10",
  "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
  "hypothesis>=6.0",
  "pytest>=8.0",
  "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orderguard"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
